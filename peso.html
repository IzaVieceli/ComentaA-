<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComentAí</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>💬 ComentAí</h1>

    <h2>Monte seu personagem</h2>

    <div id="avatarPeso">
        👤
    </div>

    <h3>Digite o peso do personagem</h3>

    <p class="info">
        Entre <b>40 kg</b> e <b>160 kg</b>
    </p>

    <input
        type="number"
        id="peso"
        min="40"
        max="160"
        placeholder="Ex.: 72"
        oninput="atualizarPeso()">

    <p id="valorPeso">72 kg</p>

    <button id="continuar" onclick="salvarPeso()" disabled>
        Continuar
    </button>

</div>

<script src="peso.js"></script>

</body>
</html>
