<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComentAí</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>💬 ComentAí</h1>

    <div id="avatarPeso">
        👤
    </div>

    <h3>Qual será o peso do personagem?</h3>

    <p class="info">
        Informe um valor entre <strong>40</strong> e <strong>160 kg</strong>.
    </p>

    <div class="campoPeso">

        <input
            type="number"
            id="peso"
            min="40"
            max="160"
            placeholder="72"
            oninput="atualizarPeso()">

        <span>kg</span>

    </div>

    <p id="valorPeso"></p>

    <button
        id="continuar"
        onclick="salvarPeso()"
        disabled>

        Continuar

    </button>

</div>

<script src="peso.js"></script>

</body>

</html>
