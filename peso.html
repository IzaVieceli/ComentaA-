<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComentAí</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>💬 ComentAí</h1>

    <div id="avatarPeso">

<svg
    id="avatarSVG"
    width="180"
    height="280"
    viewBox="0 0 180 280">

    <!-- Cabeça -->
    <circle
        cx="90"
        cy="45"
        r="28"
        fill="#FFD7B5"/>

    <!-- Corpo -->
    <rect
        id="corpo"
        x="60"
        y="80"
        width="60"
        height="95"
        rx="25"
        fill="#2563EB"/>

    <!-- Braço esquerdo -->
    <rect
        x="35"
        y="90"
        width="20"
        height="85"
        rx="10"
        fill="#FFD7B5"/>

    <!-- Braço direito -->
    <rect
        x="125"
        y="90"
        width="20"
        height="85"
        rx="10"
        fill="#FFD7B5"/>

    <!-- Perna esquerda -->
    <rect
        x="68"
        y="175"
        width="18"
        height="75"
        rx="10"
        fill="#1E3A8A"/>

    <!-- Perna direita -->
    <rect
        x="94"
        y="175"
        width="18"
        height="75"
        rx="10"
        fill="#1E3A8A"/>

</svg>

</div>

    <h3>Qual será o peso do personagem?</h3>

    <p class="info">
        Informe um valor entre <strong>40</strong> e <strong>160 kg</strong>.
    </p>

    <div class="campoPeso">

        <input
            type="number"
            id="peso"
            min="40"
            max="160"
            placeholder="72"
            oninput="atualizarPeso()">

        <span>kg</span>

    </div>

    <p id="valorPeso"></p>

    <button
        id="continuar"
        onclick="salvarPeso()"
        disabled>

        Continuar

    </button>

</div>

<script src="peso.js"></script>

</body>

</html>
